name: Release

# Creates tag + GitHub release automatically when the version in
# manifest.json on main has no release yet. HACS shows the release tag
# as version (https://www.hacs.xyz/docs/publish/start/).
on:
  push:
    branches: [main]
    paths:
      - custom_components/steinel_ble/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release for new manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version custom_components/steinel_ble/manifest.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists already – nothing to do"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "$tag"
          fi
